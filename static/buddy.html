<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>啾啾陪玩中</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; user-select: none; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; padding: 8px; }
  .bubble { max-width: 230px; background: #fff; color: #1b2036; font-size: 15px; font-weight: 700; line-height: 1.4;
    padding: 10px 14px; border-radius: 18px 18px 4px 18px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    margin: 0 70px 4px 0; transform-origin: bottom right; }
  .bubble.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .bubble.hide { opacity: 0; transform: scale(.6); transition: .4s; }
  .bubble.wow { background: #fff6d6; } .bubble.sad { background: #e8f0ff; } .bubble.cheer { background: #ffe8ec; }
  svg { width: 96px; height: 96px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); animation: bob 3s ease-in-out infinite; }
  .jump svg { animation: jump .6s ease, bob 3s ease-in-out .6s infinite; }
  .shake svg { animation: shake .5s ease, bob 3s ease-in-out .5s infinite; }
  .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  .heart { position: absolute; bottom: 70px; right: 40px; font-size: 18px; animation: up 1.6s ease-out forwards; pointer-events: none; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  @keyframes jump { 0% { transform: translateY(0); } 40% { transform: translateY(-26px) scale(1.08); } 100% { transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes up { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), -110px) scale(1.2); opacity: 0; } }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="bubble hide" id="bubble"></div>
  <div id="bot"></div>
</div>
<script>
function bot(mood) {
  const mouth = mood === "sad" ? '<path d="M42 66 q8 -6 16 0" stroke="#c7cdf5" stroke-width="3" fill="none" stroke-linecap="round"/>'
    : mood === "wow" ? '<ellipse cx="50" cy="64" rx="5" ry="6" fill="#c7cdf5"/>'
    : '<path d="M41 62 q9 9 18 0" stroke="#c7cdf5" stroke-width="3" fill="none" stroke-linecap="round"/>';
  const eyes = mood === "wow"
    ? '<path d="M33 50 l6 -5 l6 5" stroke="#4fe3b5" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M55 50 l6 -5 l6 5" stroke="#4fe3b5" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : '<g class="eye"><ellipse cx="39" cy="50" rx="5" ry="6.5" fill="#4fe3b5"/><circle cx="41" cy="47.5" r="1.8" fill="#fff"/></g><g class="eye"><ellipse cx="61" cy="50" rx="5" ry="6.5" fill="#4fe3b5"/><circle cx="63" cy="47.5" r="1.8" fill="#fff"/></g>';
  return `<svg viewBox="0 0 100 100"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#dfe3ff"/></linearGradient></defs>
    <line x1="50" y1="22" x2="50" y2="10" stroke="#c7cdf5" stroke-width="3" stroke-linecap="round"/>
    <path d="M50 2 l2.6 5.3 5.8.8 -4.2 4.1 1 5.8 -5.2-2.7 -5.2 2.7 1-5.8 -4.2-4.1 5.8-.8z" fill="#ffd166"/>
    <ellipse cx="14" cy="56" rx="7" ry="11" fill="#ff4f64"/><ellipse cx="86" cy="56" rx="7" ry="11" fill="#ff4f64"/>
    <rect x="16" y="20" width="68" height="66" rx="32" fill="url(#mg)"/><rect x="25" y="34" width="50" height="38" rx="18" fill="#2a2f55"/>
    ${eyes}<g transform="translate(0,-2)">${mouth}</g>
    <ellipse cx="30" cy="62" rx="4" ry="2.5" fill="#ff9f80" opacity="${mood === "sad" ? ".3" : ".85"}"/><ellipse cx="70" cy="62" rx="4" ry="2.5" fill="#ff9f80" opacity="${mood === "sad" ? ".3" : ".85"}"/>
    ${mood === "sad" ? '<path d="M66 58 q2 6 0 8 q-2 -2 0 -8z" fill="#7fc7ff"/>' : ""}
    <path d="M38 86 q12 8 24 0" fill="#c7cdf5"/></svg>`;
}
const wrap = document.getElementById("wrap"), bubble = document.getElementById("bubble"), botEl = document.getElementById("bot");
let lastT = 0, hideTimer = null;
botEl.innerHTML = bot("happy");

function hearts(n, ch) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "heart";
    h.textContent = ch;
    h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    h.style.animationDelay = (i * 0.15) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
}
function show(line, mood) {
  botEl.innerHTML = bot(mood);
  wrap.classList.remove("jump", "shake");
  void wrap.offsetWidth;
  wrap.classList.add(mood === "sad" ? "shake" : "jump");
  bubble.className = "bubble pop " + mood;
  bubble.textContent = line;
  if (mood === "wow") hearts(4, "✨");
  else if (mood === "cheer") hearts(3, "💪");
  else if (mood === "sad") hearts(3, "💗");
  else hearts(2, "💕");
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => { bubble.className = "bubble hide " + mood; botEl.innerHTML = bot("happy"); }, 9000);
}
async function poll() {
  try {
    const s = await fetch("/api/buddy/state", { cache: "no-store" }).then((r) => r.json());
    if (s.t && s.t !== lastT) { lastT = s.t; show(s.line, s.mood || "happy"); }
  } catch { /* 主程式關掉了 */ }
}
setInterval(poll, 2000);
poll();
</script>
</body>
</html>
