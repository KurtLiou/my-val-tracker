<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>啾啾陪玩中</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; user-select: none; }
  .wrap { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: flex-end; justify-content: flex-end; padding: 8px; }
  .bubble { max-width: calc(100% - 30px); background: #fff; color: #1b2036; font-size: calc(15px * var(--k, 1)); font-weight: 700; line-height: 1.4;
    padding: 10px 14px; border-radius: 18px 18px 4px 18px; box-shadow: 0 6px 20px rgba(0,0,0,.35);
    margin: 0 calc(70px * var(--k, 1)) 4px 0; transform-origin: bottom right; }
  .bubble.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1); }
  .bubble.hide { opacity: 0; transform: scale(.6); transition: .4s; }
  .bubble.wow { background: #fff6d6; } .bubble.sad { background: #e8f0ff; } .bubble.cheer { background: #ffe8ec; }
  #bot svg, #bot img { width: calc(100px * var(--k, 1)); height: calc(100px * var(--k, 1)); object-fit: contain;
    filter: drop-shadow(0 6px 14px rgba(0,0,0,.45)); animation: bob 3s ease-in-out infinite; display: block; }
  .jump #bot > * { animation: jump .6s ease, bob 3s ease-in-out .6s infinite; }
  .shake #bot > * { animation: shake .5s ease, bob 3s ease-in-out .5s infinite; }
  .eye { animation: blink 4s infinite; transform-origin: center; transform-box: fill-box; }
  .heart { position: absolute; bottom: 80px; right: 40px; font-size: 18px; animation: up 1.6s ease-out forwards; pointer-events: none; }
  /* 調整位置模式 */
  .setup .wrap { outline: 3px dashed #ffd166; outline-offset: -4px; border-radius: 18px; background: rgba(14,18,32,.55); cursor: move; }
  .done { position: absolute; left: 10px; top: 10px; display: none; background: #ff4f64; color: #fff; border: 0; border-radius: 10px;
    padding: 8px 14px; font: inherit; font-weight: 700; cursor: pointer; z-index: 5; }
  .tip { position: absolute; left: 10px; top: 48px; display: none; color: #fff; font-size: 12px; text-shadow: 0 1px 3px #000; max-width: 60%; }
  .setup .done, .setup .tip { display: block; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-7px) rotate(3deg); } }
  @keyframes jump { 0% { transform: translateY(0); } 40% { transform: translateY(-26px) scale(1.08); } 100% { transform: translateY(0); } }
  @keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
  @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
  @keyframes up { from { transform: translate(0,0) scale(.6); opacity: 1; } to { transform: translate(var(--dx), -110px) scale(1.2); opacity: 0; } }
</style>
<script src="/static/skins.js"></script>
</head>
<body>
<button class="done" id="done">✓ 完成</button>
<div class="tip">把我拖到想要的位置，再按「完成」</div>
<div class="wrap pywebview-drag-region" id="wrap">
  <div class="bubble hide" id="bubble"></div>
  <div id="bot"></div>
</div>
<script>
const qs = new URLSearchParams(location.search);
const SETUP = qs.get("setup") === "1";
const wrap = document.getElementById("wrap"), bubble = document.getElementById("bubble"), botEl = document.getElementById("bot");
let skin = { skin: "jiujiu", files: [], size: "m" }, lastT = 0, hideTimer = null;

function art(mood) {
  if (skin.skin === "custom" && skin.files.length) {
    const pickFile = (m) => skin.files.find((f) => f.replace(/\.[^.]+$/, "").toLowerCase() === m);
    const f = pickFile(mood) || pickFile("happy") || pickFile("default") || skin.files[0];
    return `<img src="/custom-buddy/${encodeURIComponent(f)}" alt="">`;
  }
  return (window.SKINS[skin.skin] || window.SKINS.jiujiu).svg(mood);
}
function hearts(n, ch) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "heart"; h.textContent = ch;
    h.style.setProperty("--dx", (Math.random() * 80 - 40) + "px");
    h.style.animationDelay = (i * 0.15) + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 2200);
  }
}
function show(line, mood) {
  botEl.innerHTML = art(mood);
  wrap.classList.remove("jump", "shake"); void wrap.offsetWidth;
  wrap.classList.add(mood === "sad" ? "shake" : "jump");
  bubble.className = "bubble pop " + mood;
  bubble.textContent = line;
  hearts(mood === "wow" ? 4 : 3, { wow: "✨", cheer: "💪", sad: "💗" }[mood] || "💕");
  clearTimeout(hideTimer);
  if (!SETUP) hideTimer = setTimeout(() => { bubble.className = "bubble hide " + mood; botEl.innerHTML = art("happy"); }, 9000);
}
async function poll() {
  try {
    const s = await fetch("/api/buddy/state", { cache: "no-store" }).then((r) => r.json());
    if (s.t && s.t !== lastT && !SETUP) { lastT = s.t; show(s.line, s.mood || "happy"); }
  } catch { /* 主程式關掉了 */ }
}
(async function init() {
  try { skin = await fetch("/api/buddy/skin", { cache: "no-store" }).then((r) => r.json()); } catch { /* 用預設 */ }
  document.documentElement.style.setProperty("--k", { s: 0.8, m: 1, l: 1.3 }[skin.size] || 1);
  botEl.innerHTML = art("happy");
  if (SETUP) {
    document.body.classList.add("setup");
    show("拖我到想要的位置吧～", "wow");
    document.getElementById("done").onclick = () => {
      if (window.pywebview?.api?.save_position) window.pywebview.api.save_position();
    };
  } else {
    setInterval(poll, 2000);
    poll();
  }
})();
</script>
</body>
</html>
